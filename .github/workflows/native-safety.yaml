on:
  schedule:
    - cron: "23 7 15 * *"
  workflow_dispatch:

name: native-safety

jobs:
  valgrind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y valgrind
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: local::.
          needs: check
      - name: Run malformed DBC corpus under Valgrind
        run: R -d "valgrind --tool=memcheck --error-exitcode=99" --vanilla -f tests/native/fuzz-dbc.R

  ubsan:
    runs-on: ubuntu-latest
    env:
      CFLAGS: -O1 -g -fsanitize=undefined -fno-sanitize-recover=all
      LDFLAGS: -fsanitize=undefined
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: local::.
          needs: check
      - name: Run malformed DBC corpus with UBSan
        run: Rscript tests/native/fuzz-dbc.R
