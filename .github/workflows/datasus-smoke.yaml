on:
  schedule:
    - cron: "17 9 * * 2"
  workflow_dispatch:

name: live-datasus-smoke-test

jobs:
  live-smoke-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        information-system:
          - SIM-DO
          - SINASC
          - SIH-RD
          - SIA-PA
          - CNES-ST
          - SINAN-DENGUE
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      MICRODATASUS_SMOKE_SYSTEM: ${{ matrix.information-system }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: local::.
          needs: check

      - name: Check DataSUS discovery, DBC reading, and TabWin processing
        run: Rscript tests/smoke/live-datasus.R
