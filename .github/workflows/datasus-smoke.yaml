on:
  schedule:
    - cron: "17 9 * * 2"
  workflow_dispatch:

name: live-datasus-smoke-test

jobs:
  representative-live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        information-system:
          - SIM-DO
          - SINASC
          - SIH-RD
          - SIA-PA
          - CNES-ST
          - SINAN-DENGUE
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      MICRODATASUS_SMOKE_SYSTEM: ${{ matrix.information-system }}
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: local::.
          needs: check
      - name: Check DataSUS discovery, DBC reading, and TabWin processing
        run: Rscript tests/smoke/live-datasus.R

  rotating-subsystem-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      MICRODATASUS_SMOKE_CACHE: ${{ github.workspace }}/.cache/rotating-smoke
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: local::.
          needs: check
      - uses: actions/cache@v4
        with:
          path: .cache/rotating-smoke
          key: rotating-smoke-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            rotating-smoke-${{ runner.os }}-
      - name: Exercise one rotating subsystem from every family
        run: Rscript tests/smoke/rotating-live.R
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rotating-subsystem-coverage
          path: smoke-results/
