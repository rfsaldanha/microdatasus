on:
  push:
    branches: [dev]
    paths:
      - "R/cache.R"
      - "R/datasus_download_helpers.R"
      - "R/tabwin_dictionary.R"
      - "R/tabwin_fetch.R"
      - ".github/workflows/cache-concurrency.yaml"
      - "tests/stress/**"
  schedule:
    - cron: "11 6 8 * *"
  workflow_dispatch:

name: cache-concurrency

jobs:
  stress:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: local::.
          needs: check
      - name: Stress atomic cache writes across R processes
        run: Rscript tests/stress/cache-concurrency.R
