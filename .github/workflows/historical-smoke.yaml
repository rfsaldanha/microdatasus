on:
  schedule:
    - cron: "29 7 15 * *"
  workflow_dispatch:

name: historical-layout-smoke

jobs:
  historical-layouts:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      MICRODATASUS_HISTORICAL_CACHE: ${{ github.workspace }}/.cache/microdatasus
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: local::.
          needs: check
      - uses: actions/cache@v4
        with:
          path: .cache/microdatasus
          key: historical-layouts-${{ runner.os }}-v1
      - name: Check every historical definition transition
        run: Rscript tests/smoke/historical-layouts.R
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historical-layout-results
          path: historical-results/
