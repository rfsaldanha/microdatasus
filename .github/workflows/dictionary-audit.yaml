on:
  schedule:
    - cron: "41 8 1 * *"
  workflow_dispatch:

name: dictionary-audit

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      MICRODATASUS_AUDIT_CACHE: ${{ github.workspace }}/.cache/microdatasus
      MICRODATASUS_AUDIT_BASELINE: ${{ github.workspace }}/.cache/audit-baseline
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: local::.
          needs: check
      - uses: actions/cache@v4
        with:
          path: .cache/microdatasus
          key: datasus-dictionaries-${{ runner.os }}-v2
      - uses: actions/cache@v4
        with:
          path: .cache/audit-baseline
          key: datasus-audit-baseline-${{ github.run_id }}
          restore-keys: |
            datasus-audit-baseline-
      - name: Audit all supported TabWin definitions
        run: Rscript tests/smoke/audit-dictionaries.R
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dictionary-audit
          path: audit-results/
