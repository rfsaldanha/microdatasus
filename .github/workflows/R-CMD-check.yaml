# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,   r: 'release'}
          - {os: ubuntu-latest,   r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'

      # Artifact downloads require authentication. Publish only sanitized
      # failure identifiers (never arbitrary log contents) so platform-only
      # failures can still be diagnosed through public check annotations.
      - name: Surface sanitized Windows check diagnostics
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $patterns = @(
            '^\* checking .* (ERROR|WARNING|NOTE)$',
            '^Status: ',
            '^── (Failure|Error)',
            '^══ Failed',
            '^\[ FAIL ',
            '^ERROR:',
            '(?i)fatal error',
            '(?i)error C[0-9]+',
            '(?i)undefined reference',
            '(?i)ld\.exe:',
            '(?i)make(\.exe)?: \*\*\*'
          )
          $diagnostics = Get-ChildItem -Path check -Recurse -File `
            -ErrorAction SilentlyContinue | Where-Object {
              $_.Name -in @('00check.log', '00install.out', 'testthat.Rout') -or
                $_.Name -like '*.Rout.fail'
            }
          $matches = foreach ($diagnostic in $diagnostics) {
            Select-String -Path $diagnostic.FullName -Pattern $patterns |
              ForEach-Object { "$(Split-Path $_.Path -Leaf):$($_.LineNumber): $($_.Line)" }
          }
          $matches = @($matches | Select-Object -Last 80)
          if (-not $matches) {
            $matches = @('R CMD check failed, but no sanitized diagnostic pattern matched.')
          }
          $message = ($matches -join "`n")
          $message = $message.Replace($env:GITHUB_WORKSPACE, '<workspace>')
          $message = $message -replace '(?i)(token|password|secret|authorization)[=: ]+\S+', '$1=<redacted>'
          $message = $message -replace 'https?://\S+', '<url>'
          $message = $message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
          Write-Output "::error title=Sanitized Windows R CMD check diagnostic::$message"
