on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - "R/process_*.R"
      - "R/tabwin_*.R"
      - "benchmarks/**"

name: processing-performance

jobs:
  benchmark:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      MICRODATASUS_BENCHMARK_MAX_SECONDS: 30
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: local::.
          needs: check

      - name: Run reproducible processing benchmarks
        run: Rscript benchmarks/processing.R

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: processing-benchmarks
          path: benchmarks/results.csv
