on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]
  workflow_dispatch:

name: test-coverage

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::covr
            any::xml2
          needs: coverage

      - name: Measure test coverage
        run: |
          source("tests/support/ci-helpers.R")
          coverage <- covr::package_coverage(quiet = FALSE)
          print(coverage)
          total <- covr::percent_coverage(coverage)
          by_file <- covr::coverage_to_list(coverage)$filecoverage
          critical <- c(
            "R/cache.R", "R/datasus_download_helpers.R",
            "R/tabwin_dictionary.R", "R/tabwin_fetch.R",
            "R/dictionary_audit.R", "R/dictionary_inspection.R",
            "R/fetch_datasus.R", "R/fetch_processing.R",
            "R/lockfile.R", "R/processing_diagnostics.R",
            "R/reference_tables.R", "R/schema_validation.R"
          )
          .ci_check_coverage(total, by_file, critical)
          covr::to_cobertura(coverage, filename = "coverage.xml")
        shell: Rscript {0}

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
